<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Morph</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Pixel Morph</h1>
  <div id="controls">
    <div class="drop-container">
      <div class="drop-column">
        <div class="column-header">
          <span class="column-title">Source</span>
          <button type="button" class="preset-trigger-btn" data-slot="1">Presets</button>
        </div>
        <div class="drop-zone" id="dropZone1">
          <input type="file" id="img1" accept="image/*" class="file-input" />
          <div class="prompt" id="prompt1">Drop Image or Click</div>
          <img id="preview1" class="preview-thumb" alt="Source Preview" />
        </div>
      </div>
      <div class="drop-column">
        <div class="column-header">
          <span class="column-title">Target</span>
          <button type="button" class="preset-trigger-btn" data-slot="2">Presets</button>
        </div>
        <div class="drop-zone" id="dropZone2">
          <input type="file" id="img2" accept="image/*" class="file-input" />
          <div class="prompt" id="prompt2">Drop Image or Click</div>
          <img id="preview2" class="preview-thumb" alt="Target Preview" />
        </div>
      </div>
    </div>
    <div class="slider-group">
      <label for="speedSlider">Speed: <span id="speedVal">1.0x</span></label>
      <input type="range" id="speedSlider" min="0.2" max="2.0" step="0.1" value="1.0" />
    </div>
    <button type="button" id="morphBtn">Start Morph</button>
  </div>
  <canvas id="canvas" width="256" height="256"></canvas>

  <div id="explorerModal" class="modal-overlay hidden">
    <div class="explorer-window">
      <div class="explorer-titlebar">
        <div class="titlebar-title">Presets - File Explorer</div>
        <button type="button" class="titlebar-close" id="modalCloseBtn">X</button>
      </div>
      <div class="explorer-address-bar">
        <span>This PC &gt; Pixel-Morph &gt; presets</span>
        <button type="button" id="importPresetBtn" class="explorer-add-btn">+ Add Image</button>
        <input type="file" id="presetImportInput" accept="image/*" multiple style="display:none;" />
      </div>
      <div class="explorer-content" id="explorerList"></div>
      <div class="explorer-statusbar">
        <span id="fileCountText">0 items</span>
      </div>
    </div>
  </div>

  <script src="presets.js?v=2"></script>
  <script src="script.js?v=2"></script>
</body>
</html>
